# for spring boot
server.port=${SERVER_PORT:8080}

# for mysql
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.openisle.service.CosImageUploader=DEBUG
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:openisle}?useUnicode=yes&characterEncoding=UTF-8&useInformationSchema=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:openisle}
spring.datasource.password=${MYSQL_PASSWORD:openisle}
spring.jpa.hibernate.ddl-auto=update

# for redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASS: null}

# for jwt
app.jwt.secret=${JWT_SECRET:jwt_sec}
app.jwt.reason-secret=${JWT_REASON_SECRET:jwt_reason_sec}
app.jwt.reset-secret=${JWT_RESET_SECRET:jwt_reset_sec}
app.jwt.invite-secret=${JWT_INVITE_SECRET:jwt_invite_sec}
# 30 days
app.jwt.expiration=${JWT_EXPIRATION:2592000000}
# 30 minutes
app.jwt.reset-expiration=${JWT_RESET_EXPIRATION:1800000}
# Password strength: LOW, MEDIUM or HIGH
app.password.strength=${PASSWORD_STRENGTH:LOW}

# Post publish mode: DIRECT or REVIEW
app.post.publish-mode=${POST_PUBLISH_MODE:DIRECT}

# User register mode: DIRECT or WHITELIST
app.register.mode=${REGISTER_MODE:DIRECT}

# Image upload configuration
app.upload.check-type=${UPLOAD_CHECK_TYPE:true}
app.upload.max-size=${UPLOAD_MAX_SIZE:5242880}
app.upload.provider=${UPLOAD_PROVIDER:auto}
app.upload.local-dir=${UPLOAD_LOCAL_DIR:uploads}
app.upload.local-base-url=${UPLOAD_LOCAL_BASE_URL:http://localhost:${server.port}/uploads}

# Default avatar generator configuration
app.avatar.style=${AVATAR_STYLE:pixel-art-neutral}
app.avatar.size=${AVATAR_SIZE:128}
app.avatar.base-url=${AVATAR_BASE_URL:https://api.dicebear.com/6.x}

# Default list size for user posts and replies
app.user.posts-limit=${USER_POSTS_LIMIT:10}
app.user.replies-limit=${USER_REPLIES_LIMIT:50}
# Length of extracted snippets for posts and search (-1 to disable truncation)
app.snippet-length=${SNIPPET_LENGTH:200}

# OpenSearch integration
app.search.enabled=${SEARCH_ENABLED:false}
app.search.host=${OPENSEARCH_HOST:opensearch}
app.search.port=${OPENSEARCH_PORT:9200}
app.search.scheme=${OPENSEARCH_SCHEME:http}
app.search.username=${OPENSEARCH_USERNAME:}
app.search.password=${OPENSEARCH_PASSWORD:}
app.search.index-prefix=${SEARCH_INDEX_PREFIX:openisle}
app.search.highlight-fragment-size=${SEARCH_HIGHLIGHT_FRAGMENT_SIZE:${SNIPPET_LENGTH:200}}
app.search.reindex-on-startup=${SEARCH_REINDEX_ON_STARTUP:false}
app.search.reindex-batch-size=${SEARCH_REINDEX_BATCH_SIZE:500}

# WHU campus forum configuration
app.whu.mode=${WHU_MODE:true}
app.whu.identity-hash-salt=${WHU_IDENTITY_HASH_SALT:whuforum-dev-salt}
app.whu.identity-encryption-key=${WHU_IDENTITY_ENCRYPTION_KEY:}
app.whu.init-categories=${WHU_INIT_CATEGORIES:true}

# Moderation configuration. Comma-separated words.
app.moderation.blocked-words=${MODERATION_BLOCKED_WORDS:}
app.moderation.crisis-words=${MODERATION_CRISIS_WORDS:}

# Captcha configuration
app.captcha.enabled=${CAPTCHA_ENABLED:false}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.captcha.register-enabled=${CAPTCHA_REGISTER_ENABLED:false}
app.captcha.login-enabled=${CAPTCHA_LOGIN_ENABLED:false}
app.captcha.post-enabled=${CAPTCHA_POST_ENABLED:false}
app.captcha.comment-enabled=${CAPTCHA_COMMENT_ENABLED:false}

# ========= Optional =========
# Email sender. Use resend, smtp, or tencent-ses.
app.email.provider=${EMAIL_PROVIDER:resend}
app.email.from-name=${EMAIL_FROM_NAME:WHUforum}
app.email.verification-token-expiration-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:1440}

# Resend email send service. RESEND_FROM_EMAIL must use a verified sender domain.
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:}

# SMTP email send service, used when EMAIL_PROVIDER=smtp.
smtp.host=${SMTP_HOST:}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from.email=${SMTP_FROM_EMAIL:}
smtp.auth=${SMTP_AUTH:true}
smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
smtp.connection-timeout=${SMTP_CONNECTION_TIMEOUT:10000}
smtp.timeout=${SMTP_TIMEOUT:10000}
smtp.write-timeout=${SMTP_WRITE_TIMEOUT:10000}

# Tencent Cloud SES email send service, used when EMAIL_PROVIDER=tencent-ses.
tencent.ses.secret-id=${TENCENTCLOUD_SECRET_ID:${TENCENT_SES_SECRET_ID:}}
tencent.ses.secret-key=${TENCENTCLOUD_SECRET_KEY:${TENCENT_SES_SECRET_KEY:}}
tencent.ses.region=${TENCENT_SES_REGION:ap-guangzhou}
tencent.ses.endpoint=${TENCENT_SES_ENDPOINT:ses.tencentcloudapi.com}
tencent.ses.from-email=${TENCENT_SES_FROM_EMAIL:}
tencent.ses.template-id=${TENCENT_SES_TEMPLATE_ID:}
tencent.ses.register-template-id=${TENCENT_SES_REGISTER_TEMPLATE_ID:${TENCENT_SES_TEMPLATE_ID:}}
tencent.ses.reset-template-id=${TENCENT_SES_RESET_TEMPLATE_ID:}
tencent.ses.test-template-id=${TENCENT_SES_TEST_TEMPLATE_ID:${TENCENT_SES_REGISTER_TEMPLATE_ID:${TENCENT_SES_TEMPLATE_ID:}}}
tencent.ses.reply-to=${TENCENT_SES_REPLY_TO:}
tencent.ses.trigger-type=${TENCENT_SES_TRIGGER_TYPE:1}


# for tencent cloud image upload service, you can improve your service by yourself
cos.base-url=${COS_BASE_URL:https://example.com}
cos.secret-id=${COS_SECRET_ID:}
cos.secret-key=${COS_SECRET_KEY:}
cos.region=${COS_REGION:ap-guangzhou}
cos.bucket-name=${COS_BUCKET_NAME:}
# your image upload services: ...

# OpenAI configuration
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# AI markdown format usage limit per user per day (-1 for unlimited)
app.ai.format-limit=${AI_FORMAT_LIMIT:3}
app.default-tags.enabled=${DEFAULT_TAGS_ENABLED:true}

# Website URL for emails and redirects
app.website-url=${WEBSITE_URL:http://localhost:3000}

# Web push configuration
app.webpush.public-key=${WEBPUSH_PUBLIC_KEY:}
app.webpush.private-key=${WEBPUSH_PRIVATE_KEY:}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ 队列配置 - 修改为非持久化以匹配现有队列
rabbitmq.queue.durable=true
rabbitmq.sharding.enabled=true

# springdoc-openapi-starter-webmvc-api
# see https://springdoc.org/#springdoc-openapi-core-properties
springdoc.api-docs.path=/api/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.api-docs.servers[0].url=http://localhost:3000
springdoc.api-docs.servers[0].description=Local Environment
springdoc.api-docs.servers[1].url=http://localhost:3000
springdoc.api-docs.servers[1].description=Staging Environment
springdoc.info.title=WHUforum
springdoc.info.description=WHUforum Open API Documentation
springdoc.info.version=0.0.1
springdoc.info.scheme=Bearer
springdoc.info.header=Authorization

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
